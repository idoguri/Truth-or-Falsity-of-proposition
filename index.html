<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>truth-or-falsity-of-proposition</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 id="quizHeading">次の命題の真偽を選べ</h1>

    <div id="quizContainer" style="display: none;">
        <div id="questionText"></div>
        <div id="options"></div>
    </div>
    
    <div id="resultContainer" style="display: none;">
        <!-- 得点を上に移動 -->
        <div id="score"></div>
        <div id="resultList"></div>
        <button id="retryButton" onclick="restartQuiz()">再挑戦</button>
    </div>
    
    <button id="startButton" onclick="startQuiz()">問題開始</button>
    <script src="quiz.js"></script>
</body>
</html>
